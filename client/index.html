<!doctype html>
<html lang="vi" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEB SAAS - Quản Trị Đa Chi Nhánh & Bán Hàng</title>
    <!-- PWA Desktop & Mobile Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Nền tảng Quản trị Đa Chi Nhánh & Bán Hàng POS Không Cần Code" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MEB POS" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Triệt tiêu toàn bộ Service Worker & Dọn sạch Cache để chống lỗi màn hình trắng -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.unregister();
            console.log('🧹 [MEB]: Đã gỡ Service Worker thành công:', reg.scope);
          }
        });
      }
      if (window.caches) {
        caches.keys().then((names) => {
          for (const name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
  </body>
</html>
